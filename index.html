<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>49 Months Receipt</title>
    <style>
        body {
            background-color: #e5e5e5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .receipt {
            background: #fff;
            padding: 25px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-top: 5px solid #333;
        }
        .text-center { text-align: center; }
        .line { border-bottom: 1px dashed #000; margin: 15px 0; }
        .item { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem; }
        .total { font-weight: bold; font-size: 1.1rem; }
        .barcode {
            font-family: 'Libre Barcode 128', cursive;
            font-size: 2.2rem;
            text-align: center;
            margin-top: 15px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

<div class="receipt">
    <div class="text-center">
        <h2>OUR STORY</h2>
        <p>49 MONTHS ANNIVERSARY</p>
        <p>DATE: TODAY & FOREVER</p>
    </div>

    <div class="line"></div>

    <div class="item"><span>MONTHS TOGETHER</span><span>49.00</span></div>
    <div class="item"><span>DAYS SHARED</span><span>1,491</span></div>
    <div class="item"><span>INSIDE JOKES</span><span>∞</span></div>
    <div class="item"><span>LATE NIGHT TALKS</span><span>1,000+</span></div>
    <div class="item"><span>ARGUMENTS SOLVED</span><span>100%</span></div>

    <div class="line"></div>

    <div class="item total"><span>TOTAL LOVE</span><span>PRICELESS</span></div>
    <div class="item"><span>AUTH CODE:</span><span>BOOTHANG43</span></div>

    <div class="line"></div>

    <p style="font-size: 0.8rem; text-align: center; line-height: 1.4;">
        Thank you for 49 incredible months.<br>Here's to a lifetime more.
    </p>

    <div class="barcode">||| | ||||| ||| |||| ||</div>
</div>

</body>
</html>
